  scope: "noi_dia + hang_nang tại 12 depot theo A3 của TV1. Chi phí mỗi việc thành công là 2.696 đ (0,22×) và 8.221 đ (0,69×) (simulated). Để ngoài pilot: quoc_te 22.515 đ (1,88×, thành công 27,3%) và doi_tac 10.215 đ (0,85×, điều khoản riêng) (simulated)."
