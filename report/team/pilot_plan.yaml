# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# D1 · Baseline 0,70; alpha 0,05; power 0,80; ICC 0,02.
#   a) Chia theo yêu cầu, 70% → 75%: 1.250 yêu cầu mỗi nhóm (lab13.py, NormalIndPower; z chính xác cho 1.251, lệch < 2%).
#   b) Theo nhân viên, m=75: DE=2,48; cần 3.100 yêu cầu thô (1.250 × 2,48) và 42 nhân viên mỗi nhóm, tổng 84 > 40 người.
#   c) 20 nhân viên mỗi nhóm: trần hiệu dụng 20/0,02=1.000, thấp hơn 1.251.
#   d) 6 depot mỗi nhóm: trần hiệu dụng 6/0,02=300, thấp hơn 1.251.
#   e) 70% → 76%: mốc lab 859 hiệu dụng mỗi nhóm; 20 nhân viên cần 299 yêu cầu/người,
#      5.980 yêu cầu thô mỗi nhóm, DE=6,96. Nếu tác động thật là 5 điểm, power≈0,64.
#      Script in riêng ước lượng NormalIndPower theo Cohen h để đối chiếu; phép tính cụm dùng mốc 859 của đề.
# D2 · Năm câu kiểm tra tách được tác động:
#   1. Có 20 nhân viên đối chứng chạy đồng thời với 20 nhân viên can thiệp ở cùng depot.
#   2. Bốc thăm nhân viên, phân tầng theo depot, ghi seed=130101 trước khi chạy.
#   3. Có nguy cơ chia sẻ gợi ý trong depot; giới hạn quyền theo tài khoản và kiểm tra log staff_id mỗi 1 tuần.
#   4. Chốt trước chỉ số chính, MDE=6 điểm, alpha, power, cỡ mẫu, luật dừng và ngày quyết định.
#   5. Có 20 cụm nhân viên mỗi nhóm; dùng 299 yêu cầu/người để đạt 859 hiệu dụng mỗi nhóm.
# Đánh đổi: 40 nhân viên không đủ lực cho MDE 5 điểm; chọn MDE 6 điểm, chấp nhận power≈0,64 nếu hiệu quả thật chỉ 5 điểm.
# Tỉ lệ mở lại hiện tại là 51/1.200=4,25%; trong scope A3 noi_dia + hang_nang là 39/982=3,97%.
# Luật an toàn so nhóm can thiệp với đối chứng bằng +2 điểm phần trăm và đặt trần tuyệt đối 6%.
# Theo A3 của TV1, scope gồm noi_dia (2.696 đ; 0,22×) và hang_nang (8.221 đ; 0,69×) (simulated).
# Để ngoài scope: quoc_te (22.515 đ; 1,88×) vì tỉ lệ thành công 27,3%, doi_tac (10.215 đ; 0,85×) vì điều khoản riêng (simulated).
# Phân tuyển ở cả 12 depot, chia ngẫu nhiên theo nhân viên và cân bằng theo roster từng depot để có 20 cụm mỗi nhóm.
# Lịch giả định: bắt đầu 2026-12-07; 10%, 25%, 50% lần lượt từ 07-12, 14-12, 21-12.
# Ở bước 50%, đo ít nhất 5.980 yêu cầu mỗi nhóm; ước đạt sau 10 ngày theo 1.500 yêu cầu/ngày và 982/1.200 thuộc phạm vi (simulated).
# Yêu cầu cuối dự kiến 2026-12-30; chờ đủ 7 ngày mở lại, ra quyết định dự kiến 2027-01-07.
# Các tỷ lệ E1 hiện tại tính từ CSV giả lập; trong pilot phải thay số phút simulated bằng thời gian đo thật.

pilot:
